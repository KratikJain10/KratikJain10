  <text x="24" y="72" class="sans" font-size="13" font-weight="600" fill="#f78166">RV32IM · 5-stage pipeline · on an FPGA</text>
  <text x="24" y="108" class="sans" font-size="13.5" fill="#8b949e">Designed in Verilog, run on a Basys-3 (Artix-7).</text>
