<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img" aria-label="Onyx: Redis-compatible server in C++17">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/><stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6e7681"/>
    </marker>
    <style>
      .sans{font-family:-apple-system,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}
      .box{fill:#0d1117;stroke:#30363d}
      .lbl{font-size:12px;fill:#e6edf3;text-anchor:middle}
      .sub{font-size:10.5px;fill:#8b949e;text-anchor:middle}
      .ln{stroke:#6e7681;stroke-width:1.4;fill:none;marker-end:url(#arr)}
      .flow{stroke:#58a6ff;stroke-width:2;fill:none;stroke-dasharray:4 10;animation:f 1.2s linear infinite}
      @keyframes f{to{stroke-dashoffset:-14}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="379" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect x="1" y="18" width="4" height="344" rx="2" fill="url(#accent)"/>

  <text x="32" y="48" class="sans" font-size="28" font-weight="800" fill="#e6edf3">Onyx</text>
  <text x="114" y="48" class="sans" font-size="16" fill="#8b949e">Redis-compatible server, from scratch</text>
  <g class="mono" font-size="11">
    <rect x="620" y="28" width="58" height="24" rx="12" fill="#1f2937" stroke="#30363d"/><text x="649" y="44" fill="#f78166" text-anchor="middle">C++17</text>
    <rect x="684" y="28" width="56" height="24" rx="12" fill="#1f2937" stroke="#30363d"/><text x="712" y="44" fill="#3fb950" text-anchor="middle">POSIX</text>
    <rect x="746" y="28" width="62" height="24" rx="12" fill="#1f2937" stroke="#30363d"/><text x="777" y="44" fill="#a371f7" text-anchor="middle">0 deps</text>
  </g>
  <text x="32" y="78" class="sans" font-size="13.5" fill="#8b949e">One thread, a poll() event loop, an incremental RESP2 parser, lazy + sampled active key expiry. Any Redis client just works.</text>

  <!-- stats -->
  <g class="sans">
    <g transform="translate(32 100)">
      <rect width="180" height="78" rx="10" class="box"/>
      <text x="16" y="40" font-size="28" font-weight="800" fill="url(#accent)">~1M</text>
      <text x="16" y="62" font-size="12" fill="#8b949e">req/s, pipelined</text>
    </g>
    <g transform="translate(228 100)">
      <rect width="180" height="78" rx="10" class="box"/>
      <text x="16" y="40" font-size="28" font-weight="800" fill="#e6edf3">~68K</text>
      <text x="16" y="62" font-size="12" fill="#8b949e">req/s, unpipelined</text>
    </g>
    <g transform="translate(424 100)">
      <rect width="180" height="78" rx="10" class="box"/>
      <text x="16" y="40" font-size="28" font-weight="800" fill="#e6edf3">&lt;1.7 ms</text>
      <text x="16" y="62" font-size="12" fill="#8b949e">p99 latency</text>
    </g>
    <g transform="translate(620 100)">
      <rect width="188" height="78" rx="10" class="box"/>
      <text x="16" y="40" font-size="28" font-weight="800" fill="#e6edf3">≈ Valkey</text>
      <text x="16" y="62" font-size="12" fill="#8b949e">9.1, same machine</text>
    </g>
  </g>

  <!-- diagram -->
  <text x="32" y="214" class="mono" font-size="11" fill="#6e7681">// how a request moves through it</text>
  <g class="sans">
    <rect x="32" y="232" width="96" height="52" rx="8" class="box"/>
    <text x="80" y="255" class="lbl">clients</text><text x="80" y="271" class="sub">redis-cli, libs</text>

    <rect x="160" y="226" width="116" height="64" rx="32" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="218" y="254" class="lbl mono" font-weight="700" fill="#58a6ff">poll()</text><text x="218" y="271" class="sub">one thread</text>

    <rect x="308" y="232" width="128" height="52" rx="8" class="box"/>
    <text x="372" y="255" class="lbl">per-client buffer</text><text x="372" y="271" class="sub">bytes as they arrive</text>

    <rect x="468" y="232" width="128" height="52" rx="8" class="box"/>
    <text x="532" y="255" class="lbl">RESP2 parser</text><text x="532" y="271" class="sub">full · partial · bad</text>

    <rect x="628" y="232" width="80" height="52" rx="8" class="box"/>
    <text x="668" y="255" class="lbl">keyspace</text><text x="668" y="271" class="sub">hash map</text>

    <rect x="728" y="232" width="80" height="52" rx="8" class="box"/>
    <text x="768" y="255" class="lbl mono">write()</text><text x="768" y="271" class="sub">1 per read</text>

    <path d="M128 258H158" class="ln"/>
    <path d="M276 258H306" class="ln"/>
    <path d="M436 258H466" class="ln"/>
    <path d="M596 258H626" class="ln"/>
    <path d="M708 258H726" class="ln"/>
    <path d="M128 258H158M276 258H306M436 258H466M596 258H626M708 258H726" class="flow"/>

    <rect x="160" y="316" width="300" height="44" rx="8" fill="#0d1117" stroke="#30363d" stroke-dasharray="4 3"/>
    <text x="310" y="335" class="lbl">active expiry, every 100 ms</text>
    <text x="310" y="351" class="sub">sample 20 keys · repeat if &gt;25% expired · 25 ms budget</text>
    <path d="M218 290V314" class="ln"/>
    <path d="M460 338H668V286" class="ln"/>
  </g>
</svg>
