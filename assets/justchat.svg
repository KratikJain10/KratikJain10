  <style>.sans{font-family:-apple-system,'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,'DejaVu Sans Mono',monospace}</style>
  <rect x="0.5" y="0.5" width="409" height="205" rx="14" fill="#161b22" stroke="#30363d"/>
