  <text x="386" y="46" class="mono" font-size="20" fill="#3fb950" text-anchor="end">⇄</text>
  <text x="24" y="72" class="sans" font-size="13" font-weight="600" fill="#3fb950">Real-time chat over WebSockets</text>
